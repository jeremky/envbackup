# ─── hyprlock.conf ───────────────────────────────────────────────────────

background {
    monitor     =
    path        =
    blur_passes = 2
    blur_size   = 7
    color       = rgb(30, 30, 46)
}

input-field {
    monitor            =
    size               = 250, 50
    outline_thickness  = 2
    dots_size          = 0.2
    dots_spacing       = 0.3
    dots_center        = true

    outer_color        = rgb(203, 166, 247)
    inner_color        = rgb(30, 30, 46)
    font_color         = rgb(205, 214, 244)

    placeholder_text   = <span foreground="##a6adc8">Mot de passe...</span>
    fail_color         = rgb(243, 139, 168)
}

label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgb(205, 214, 244)
    font_size   = 90
    font_family = Sans
    position    = 0, 200
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = $USER
    color       = rgb(205, 214, 244)
    font_size   = 20
    font_family = Sans
    position    = 0, 100
    halign      = center
    valign      = center
}
