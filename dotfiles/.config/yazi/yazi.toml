[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true
linemode       = "size"
scrolloff      = 5

[opener]
edit = [
  { run = 'hx %s', block = true, desc = "Helix", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { url = "*.{md,toml,yaml,yml,json,sh,lua,rs,py}", use = "edit" },
]
