[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true
linemode       = "size"
scrolloff      = 5

[opener]
vim = [
  { run = 'vim %s', block = true, desc = "Vim", for = "unix" },
]
helix = [
  { run = 'hx %s', block = true, desc = "Helix", for = "unix" },
]
zed = [
  { run = 'zedit %s', orphan = true, desc = "Zed", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = ["vim", "helix", "zed"] },
  { url = "*.{md,toml,yaml,yml,json,sh,lua,rs,py}", use = ["vim", "helix", "zed"] },
  # Extensionless files that aren't detected as text: empty or unknown content
  { mime = "inode/{empty,x-empty}", use = ["vim", "helix", "zed"] },
  { mime = "application/octet-stream", use = ["vim", "helix", "zed"] },
]
