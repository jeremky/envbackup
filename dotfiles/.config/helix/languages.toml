[[language]]
name = "bash"
formatter = { command = "shfmt", args = ["-i", "2", "-ci", "-"] }
auto-format = true

[[language]]
name = "css"
formatter = { command = "deno", args = ["fmt", "-", "--ext", "css"] }
auto-format = true

[[language]]
name = "docker-compose"
formatter = { command = "deno", args = ["fmt", "--ext", "yaml", "-"] }
auto-format = true

[[language]]
name = "html"
formatter = { command = "deno", args = ["fmt", "--ext", "html", "-"] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = "deno", args = ["fmt", "-", "--ext", "js"] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "deno", args = ["fmt", "-", "--ext", "json"] }
auto-format = true

[[language]]
name = "markdown"
formatter = { command = "deno", args = ["fmt", "--ext", "md", "-"] }
auto-format = true

[[language]]
name = "yaml"
formatter = { command = "deno", args = ["fmt", "--ext", "yaml", "-"] }
auto-format = true
