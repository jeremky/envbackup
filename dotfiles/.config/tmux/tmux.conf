# ─── tmux.conf ────────────────────────────────────────────────────────────────

# Couleurs modernes
set -ga terminal-overrides ",*256col*:Tc"

# Gestion des touches spéciales
set -g xterm-keys on

# Temps d'échappement
set -g escape-time 5

# Changement du compteur
set -g base-index 1
setw -g pane-base-index 1

# Renommage automatique des fenêtres
set -g renumber-windows on

# Temps d'affichage des messages
set -g display-time 3000

# Temps de rafraichissement
set -g status-interval 5

# Historique défilable
set -g history-limit 10000

# Surveillance des changements dans les fenêtres
set-option -wg monitor-activity on
set-option -wg monitor-bell on

# Activation de la souris
set -g mouse on

# Transmission des événements
set -g focus-events on

# ─── Mapping ──────────────────────────────────────────────────────────────────

# Prefix secondaire
set-option -g prefix2 C-Space

# Coller
bind -n C-v paste-buffer

# Split vertical / horizontal
bind -n C-S-w split-window -v -c "#{pane_current_path}"
bind -n C-x split-window -h -c "#{pane_current_path}"

# Ouverture d'un onglet via double clic
bind -n DoubleClick1StatusDefault new-window -c "#{pane_current_path}"

# Synchronisation des panes
bind S setw synchronize-panes on
bind s setw synchronize-panes off

# Navigation entre panes
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Redimensionnement des panes
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

bind -n C-n next-window
bind -n C-p previous-window
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# Déplacement des onglets
bind -n M-S-Up    swap-window -t -1 -d
bind -n M-S-Down  swap-window -t +1 -d

# Rechargement de la configuration
bind -n M-S-r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration rechargée !"

# ─── Plugins ──────────────────────────────────────────────────────────────────

# Liste des plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Installation de TPM s'il est absent
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# ─── Thème ────────────────────────────────────────────────────────────────────

# Palette et style des onglets
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

# Fond de la barre de statut aligné sur le fond du terminal (base, pas mantle)
set -g @catppuccin_status_background "#{@thm_bg}"

# Contenu de la barre de statut
set -g status-left ""
set -g status-right-length 100
set -g status-right "#[fg=#{@thm_crust},bg=#{@thm_lavender},bold] %H:%M "

# ─── Chargement des plugins ───────────────────────────────────────────────────

run '~/.config/tmux/plugins/tpm/tpm'

# Installation et chargement automatique des plugins manquants
if "test ! -d ~/.config/tmux/plugins/tmux" \
   "run '~/.config/tmux/plugins/tpm/bin/install_plugins && tmux source-file ~/.config/tmux/tmux.conf'"
