# ─── herdr ───────────────────────────────────────────────────────────────

onboarding = false

[theme]
name = "catppuccin"

[update]
version_check = false

[keys]
prefix = "ctrl+space"
previous_tab = "ctrl+w"
next_tab = "ctrl+x"
previous_workspace = "ctrl+up"
next_workspace = "ctrl+down"

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = false
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

